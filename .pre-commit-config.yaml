repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: typecheck
        name: typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$
      - id: eslint
        name: eslint
        entry: npm run lint
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$
